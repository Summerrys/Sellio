    <script>
      /* Runs before Sellio's code loads (keep in step with src/lib/googleRelay.js and
         src/lib/appLaunch.js; tests/20 checks both):
         1. /google-signin: Google sign-in from the Android app starts here, so the app's
            "Open External Link?" box names Sellio. Forwards only to Sellio's own
            Supabase Google sign-in; anything else stays on the page with an error.
         2. During the app's start, show the Sellio splash at once: from the first paint
            when the app opens, and across the reload on the way to the Dashboard. */
      (function () {
        var w = window, l = w.location;
        if (l.pathname === '/google-signin') {
          w.__sellioGoogleRelay = 'invalid';
          try {
            var configured = '%VITE_SUPABASE_URL%';
            var sb = new URL(configured.charAt(0) === '%' ? 'https://gzktuteedbtnaxfdylyu.supabase.co' : configured);
            var to = new URL(new URLSearchParams(l.search).get('to') || '');
            var q = to.searchParams;
            var back = new URL(q.get('redirect_to') || '');
            var apps = ['https://sellio.apptelier.sg', 'https://selliosg.base44.app'];
            if (to.origin === sb.origin && to.pathname === '/auth/v1/authorize' && q.get('provider') === 'google' &&
                /^[A-Za-z0-9_-]{43,128}$/.test(q.get('code_challenge') || '') && q.get('code_challenge_method') === 's256' &&
                apps.indexOf(back.origin) >= 0 && back.searchParams.get('sellio_mobile_oauth') === '1') {
              w.__sellioGoogleRelay = 'forwarding';
              l.replace(to.href);
            }
          } catch (e) { /* stays 'invalid' */ }
          return;
        }
        try {
          var store = w.sessionStorage, now = Date.now();
          var launch = JSON.parse(store.getItem('sellio-launch') || 'null');
          var age = launch ? now - launch.start : -1;
          var active = !!launch && !launch.done && age >= 0 && age < 10000;
          // The app opening at its start page (same bridge test as App.jsx's RootRoute):
          // start the launch here, so the splash is there from the first paint.
          var bridge = (w.ReactNativeWebView && typeof w.ReactNativeWebView.postMessage === 'function') ||
            (w.__hybrid_bridge && typeof w.__hybrid_bridge.sendMessage === 'function');
          if (!active && bridge && l.pathname === '/') {
            store.setItem('sellio-launch', JSON.stringify({ start: now, done: false }));
            active = true;
            age = 0;
          }
          if (active && l.search.indexOf('sellio_mobile_oauth=') < 0) {
            var html = document.documentElement;
            html.setAttribute('data-sellio-launch', '');
            // LaunchSplash.jsx takes it from here; if Sellio's code never runs, the
            // splash still goes when the launch's 10 seconds are up.
            w.setTimeout(function () { html.removeAttribute('data-sellio-launch'); }, 10000 - age);
          }
        } catch (e) { /* no storage: no splash */ }
      })();
    </script>

      /* The Sellio splash while the Android app starts: #sellio-launch-splash below, kept up
         by LaunchSplash.jsx until the first screen is ready. */
      .sellio-launch { position: fixed; inset: 0; z-index: 100000; background: #ffffff; display: flex;
        align-items: center; justify-content: center; overflow: hidden; transition: opacity 200ms ease; }
      .sellio-launch--leaving { opacity: 0; pointer-events: none; }
      #sellio-launch-splash { display: none; }
      html[data-sellio-launch] #sellio-launch-splash { display: flex; }
      .sellio-launch__glow { position: absolute; border-radius: 50%; filter: blur(64px); pointer-events: none; }
      .sellio-launch__glow--a { width: 480px; height: 480px; top: -80px; left: -100px;
        background: radial-gradient(circle, rgba(254,120,36,0.08) 0%, transparent 70%); }
      .sellio-launch__glow--b { width: 400px; height: 400px; bottom: -60px; right: -80px;
        background: radial-gradient(circle, rgba(254,120,36,0.06) 0%, transparent 70%); }
      .sellio-launch__content { position: relative; display: flex; flex-direction: column; align-items: center;
        width: 100%; padding: 0 32px; box-sizing: border-box; }
      .sellio-launch__logo { height: 200px; height: clamp(100px, 25vh, 200px); height: clamp(100px, 25dvh, 200px);
        max-width: 100%; object-fit: contain; margin-bottom: 40px; flex-shrink: 0; }
      .sellio-launch__tagline { display: block; width: 256.98px; max-width: 100%; height: auto;
        aspect-ratio: 256.98 / 86.5; margin-bottom: 48px; flex-shrink: 0; }
      .sellio-launch__dots { display: flex; gap: 8px; }
      .sellio-launch__dots span { width: 8px; height: 8px; border-radius: 50%; display: inline-block;
        animation: sellio-launch-bounce 1.2s ease-in-out infinite; }
      .sellio-launch__dots span:nth-child(1) { background: #fb923c; }
      .sellio-launch__dots span:nth-child(2) { background: #e0449a; animation-delay: 200ms; }
      .sellio-launch__dots span:nth-child(3) { background: #8b2fc9; animation-delay: 400ms; }
      @keyframes sellio-launch-bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
      @media (prefers-reduced-motion: reduce) { .sellio-launch__dots span { animation: none; } }
