<!doctype html><html><head><title>Sellio notification layout verification</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#eef2f6;margin:0;padding:16px}button{padding:8px 12px;margin:4px;border:1px solid #cbd5e1;border-radius:6px;background:white}iframe{display:block;margin:12px auto;border:1px solid #cbd5e1;border-radius:12px;background:white;height:600px}p{margin:4px}</style></head><body><p>Notification UI verification · isolated sample data</p><div id="controls"><button data-width="320">320 px</button><button data-width="390">390 px</button><button data-width="768">Tablet</button><button data-width="1200">Desktop</button><button data-font="16">Default text</button><button data-font="20">Large text</button><button data-font="32">200% text</button><button data-count="1">One notification</button><button data-count="20">Many notifications</button><button data-dark="1">Dark</button><button data-dark="0">Light</button></div><iframe id="notification-frame" title="Sellio notifications test" width="390" src="./frame.html?font=16&amp;count=3"></iframe><script>let font=16,count=3,dark=0;document.getElementById('controls').addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;const frame=document.getElementById('notification-frame');if(button.dataset.width){frame.width=button.dataset.width;return;}if(button.dataset.font)font=Number(button.dataset.font);if(button.dataset.count)count=Number(button.dataset.count);if(button.dataset.dark)dark=Number(button.dataset.dark);frame.src='./frame.html?font='+font+'&count='+count+'&dark='+dark;});</script></body></html>
